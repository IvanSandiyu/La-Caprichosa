services:
  - type: web
    name: la-caprichosa-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --only-binary :all: -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/grid
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: CORS_ORIGINS
        value: "*"
      # Credenciales de Turso (feedback del sitio). Se cargan una sola vez en
      # el dashboard de Render (secrets, sync: false), con los mismos valores
      # de backend/.env de desarrollo.
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
